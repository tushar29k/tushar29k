</linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
<stop offset=".45" stop-color="#ffffff" stop-opacity=".045"/>
<stop offset="1" stop-color="#ffffff" stop-opacity=".02"/>
</linearGradient>
