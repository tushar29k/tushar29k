<style>
.pill{animation:pillTint 8s ease-in-out infinite}
@keyframes pillTint{
0%,100%{stroke:#22d3ee;filter:drop-shadow(0 0 5px rgba(34,211,238,.55))}
25%{stroke:#2dd4bf;filter:drop-shadow(0 0 5px rgba(45,212,191,.55))}
50%{stroke:#a78bfa;filter:drop-shadow(0 0 5px rgba(167,139,250,.55))}
75%{stroke:#f472b6;filter:drop-shadow(0 0 5px rgba(244,114,182,.55))}
}
.beam{animation:beamFlow 7s linear infinite}
@keyframes beamFlow{0%{stop-color:#22d3ee}25%{stop-color:#2dd4bf}50%{stop-color:#a78bfa}75%{stop-color:#f472b6}100%{stop-color:#22d3ee}}
text{font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
</style>
