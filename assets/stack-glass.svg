<svg xmlns="http://www.w3.org/2000/svg" width="820" height="466" viewBox="0 0 820 466" role="img" aria-label="Tech stack">
<style>
.pill{animation:pillTint 14s ease-in-out infinite}
@keyframes pillTint{
0%,100%{stroke:#3a6a8a;filter:drop-shadow(0 0 3px rgba(56,189,248,.18))}
50%{stroke:#2dd4bf;filter:drop-shadow(0 0 4px rgba(45,212,191,.28))}
}
.beam{animation:beamFlow 9s ease-in-out infinite}
@keyframes beamFlow{0%,100%{stop-color:#38bdf8}50%{stop-color:#2dd4bf}}
text{font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
</style>
<defs>
